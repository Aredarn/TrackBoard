# Render Blueprint: the TrackBoard API as one free Docker web service.
# The database is Supabase (AWS eu-west-1), so the service runs in Frankfurt to stay close to it.
services:
  - type: web
    name: trackboard
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Liveness only: /health/ready also probes the database, and a Supabase blip should not
    # fail a deploy of an otherwise healthy build.
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render routes to $PORT; the image listens on 8080 (ASPNETCORE_URLS in the Dockerfile).
      - key: PORT
        value: "8080"
      # Render's proxy terminates TLS. Without this every request looks like it comes from
      # the proxy over http: rate limits would be shared by all clients, and HTTPS
      # redirection would see the wrong scheme.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # Supabase session pooler (port 5432). Entered in the Render dashboard, never committed.
      - key: ConnectionStrings__Default
        sync: false
      # 256-bit random value generated by Render on first deploy.
      - key: Jwt__Secret
        generateValue: true
