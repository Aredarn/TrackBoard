openapi: 3.1.0
info:
  title: TrackBoard API for TrackPro
  version: 1.0.0-draft
  summary: Track publishing, session upload and best-lap leaderboards for the TrackPro app.
  description: |
    Draft contract. Design decisions and the Room-schema mapping are in README.md next to
    this file; this document is the wire format only.

    Conventions:
    - Durations are integer milliseconds. Wall-clock times are ISO-8601 UTC.
    - Syncable records use client-generated UUIDs and are written with idempotent `PUT`.
    - Errors are RFC 7807 ProblemDetails (`application/problem+json`).
    - Enums are PascalCase strings.
  license:
    name: Apache-2.0

servers:
  - url: https://api.trackboard.example/api/v1
    description: Placeholder — no deployment exists yet.
  - url: http://10.0.2.2:5000/api/v1
    description: Local backend as seen from the Android emulator.

security:
  - bearer: []

tags:
  - name: Auth
  - name: Vehicles
  - name: Tracks
  - name: Sessions
  - name: Leaderboards

paths:
  # ── Auth (existing endpoints, relocated under /api/v1) ──────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: >-
            Wrong email or password. The body is identical for both cases so the endpoint
            cannot be used to discover which accounts exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429':
          description: >-
            Rate limited, or the account is locked after too many wrong passwords (ten within
            fifteen minutes locks it for fifteen). A locked account refuses even the right
            password until `Retry-After` has passed. An address with no account locks the same
            way.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security: []
      description: >-
        Exchanges a refresh token for a new pair. The presented token is revoked. Presenting
        an already-rotated token revokes every session for that user, so the app must
        persist the new refresh token before using the new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Refresh token revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Profile ─────────────────────────────────────────────────────────────────────────
  /me:
    get:
      tags: [Profile]
      operationId: getProfile
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      operationId: updateProfile
      description: >-
        Partial update. A field left out keeps its value; an empty string clears bio or
        country. Renaming refreshes every leaderboard the driver appears on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Profile]
      operationId: deleteAccount
      description: >-
        Permanently deletes the account: sessions, laps, vehicles, private tracks, photos
        and refresh tokens. A published track other drivers have timed on is kept under an
        anonymised owner. The email becomes free to register again. Rate limited like login.
        The body must carry the account password as well as the bearer token, so a stolen
        access token cannot delete the account. A request with no JSON body is refused with
        415, as an older client's would be.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Deleted. The app should drop its tokens. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            The password is wrong. Deliberately not 401, which a client reads as an expired
            session. Wrong guesses here count toward the same lockout as sign-in.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/stats:
    get:
      tags: [Profile]
      operationId: getProfileStats
      responses:
        '200':
          description: Totals, main vehicle, and a personal best per track with leaderboard position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/export:
    get:
      tags: [Profile]
      operationId: exportAccount
      responses:
        '200':
          description: Everything the server holds about the caller. Sent as an attachment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/uploads:
    post:
      tags: [Profile]
      operationId: createUpload
      description: >-
        Step one of a photo change. Returns a signed single-use URL; PUT the image bytes to
        it with the same Content-Type, then attach `path` with PUT /me/avatar or
        PUT /vehicles/{vehicleId}/photo. Answers 503 when the server has no photo storage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '200':
          description: Upload target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTarget' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /me/avatar:
    put:
      tags: [Profile]
      operationId: setAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMedia' }
      responses:
        '200':
          description: Attached; the previous avatar is removed from storage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The path was not signed for this profile. }
    delete:
      tags: [Profile]
      operationId: clearAvatar
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Vehicles ────────────────────────────────────────────────────────────────────────
  /vehicles:
    get:
      tags: [Vehicles]
      operationId: listMyVehicles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The caller's vehicles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehiclePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    put:
      tags: [Vehicles]
      operationId: upsertVehicle
      description: Create or replace. The id is generated by the app.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleWrite' }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
    delete:
      tags: [Vehicles]
      operationId: deleteVehicle
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`code: VehicleInUse` — the vehicle is referenced by uploaded sessions.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /vehicles/{vehicleId}/photo:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    put:
      tags: [Vehicles]
      operationId: setVehiclePhoto
      description: >-
        Attaches a photo uploaded through POST /me/uploads. The vehicle upsert never
        touches the photo, so background sync from an older build cannot erase it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMedia' }
      responses:
        '200':
          description: Attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Vehicles]
      operationId: clearVehiclePhoto
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Tracks ──────────────────────────────────────────────────────────────────────────
  /tracks:
    get:
      tags: [Tracks]
      operationId: searchTracks
      # Sign-in optional: anyone may browse published tracks. `mine=true` needs a token.
      security:
        - {}
        - bearer: []
      description: >-
        Published tracks, optionally near a point. The app calls this before publishing
        a new track, to offer an existing one instead. Readable without signing in.
      parameters:
        - name: near
          in: query
          description: '"lat,lon" in decimal degrees.'
          schema: { type: string, example: '47.5789,19.2486' }
        - name: radiusKm
          in: query
          schema: { type: number, minimum: 0.1, maximum: 200, default: 25 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TrackType' }
        - name: mine
          in: query
          description: Only the caller's own tracks, including private ones. Requires sign-in.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Matching tracks, nearest first when `near` is given.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`mine=true` without a valid token, or an invalid token was sent.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Tracks]
      operationId: getTrack
      security:
        - {}
        - bearer: []
      description: >-
        Full geometry, for importing a published track into Room. Published tracks are
        readable without signing in; private tracks only by their owner (404 to anyone else).
      responses:
        '200':
          description: The track with its ordered points.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tracks]
      operationId: upsertTrack
      description: >-
        Create or replace one of the caller's own tracks. Once any ranked lap exists on the
        track, its timing geometry is frozen — point order, positions and the start flag —
        because changing it would move the start/finish gate under laps already on the
        leaderboard. Sector flags, sector indexes and altitude may still change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackWrite' }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '409':
          description: >-
            `code: TrackGeometryLocked` — point order, positions or the start flag changed on
            a track that already has ranked laps; publish a new track instead. `code: TrackInUse` — a published track cannot be
            made private while other drivers have sessions on it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    delete:
      tags: [Tracks]
      operationId: deleteTrack
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`code: TrackInUse` — other drivers have sessions on this track. Your own sessions are kept and unlinked.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ── Sessions ────────────────────────────────────────────────────────────────────────
  /sessions:
    get:
      tags: [Sessions]
      operationId: listMySessions
      parameters:
        - name: trackId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The caller's sessions, newest first, without laps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      responses:
        '200':
          description: The session with its laps, each saying whether it counts for the leaderboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sessions]
      operationId: upsertSession
      description: >-
        Create or replace a session together with **all** of its laps and sector splits.
        Laps absent from the body are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404':
          description: The referenced vehicle or track does not exist or is not visible.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    delete:
      tags: [Sessions]
      operationId: deleteSession
      responses:
        '204': { description: 'Deleted, with its laps.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Leaderboards ────────────────────────────────────────────────────────────────────
  /tracks/{trackId}/leaderboard:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Leaderboards]
      operationId: getTrackLeaderboard
      security:
        - {}
        - bearer: []
      description: >-
        Each driver's single best ranked lap on a published track, fastest first. Phone-GPS
        and ESP32 laps share one board; each entry carries its `gpsSource`.
        Ties are broken by whoever set the time first. Public: readable without signing in,
        so it can be shared as a link. Sending a token only adds the caller's `me` entry.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: The leaderboard, plus the caller's own position if they have one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: >-
            An invalid or expired token was sent. Sending no token at all is fine; a bad one
            is rejected rather than silently ignored, so the app notices it needs to refresh.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404':
          description: No such track, or the track is not published.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    VehicleId:
      name: vehicleId
      in: path
      required: true
      description: Client-generated UUID.
      schema: { type: string, format: uuid }
    TrackId:
      name: trackId
      in: path
      required: true
      description: Client-generated UUID.
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Client-generated UUID.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, expired or invalid access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotOwner:
      description: >-
        The id exists but belongs to another user. Never overwritten; the app should treat
        this as an id collision and generate a new id.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: No such resource, or not visible to the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationFailed:
      description: Field-level validation errors.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
    StorageUnavailable:
      description: This server has no photo storage configured.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    TooManyRequests:
      description: Rate limited. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    # ── Shared ──
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        code:
          type: string
          description: >-
            Stable identifier on some 409s, for the app to branch on without parsing the
            message: TrackGeometryLocked, TrackInUse, VehicleInUse, QuotaExceeded. Also on
            the 429 for a locked account: AccountLocked (the plain rate limiter has none).

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    PageInfo:
      type: object
      required: [page, pageSize, totalCount, totalPages, hasPrevious, hasNext]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }

    GpsSource:
      type: string
      enum: [Wifi, Bluetooth, PhoneGps]
      description: Mirrors the app's GpsProviderType at the time the session was recorded.

    # ── Auth ──
    RegisterRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email, maxLength: 256 }
        displayName: { type: string, minLength: 2, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 128 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 256 }
        password: { type: string, maxLength: 128 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, maxLength: 128 }

    AuthResponse:
      type: object
      required: [accessToken, expiresAt, refreshToken, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [Driver, Admin] }

    # ── Profile ──
    Profile:
      type: object
      required: [id, email, displayName, role, memberSince]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [Driver, Admin] }
        bio: { type: [string, 'null'], maxLength: 500 }
        country: { type: [string, 'null'], maxLength: 60 }
        avatarUrl: { type: [string, 'null'], format: uri }
        memberSince: { type: string, format: date-time }

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128, description: The account's current password. }

    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        bio: { type: string, maxLength: 500, description: Empty string clears. }
        country: { type: string, maxLength: 60, description: Empty string clears. }

    ProfileVehicle:
      type: object
      required: [id, manufacturer, model, year]
      properties:
        id: { type: string, format: uuid }
        manufacturer: { type: string }
        model: { type: string }
        year: { type: integer }
        photoUrl: { type: [string, 'null'], format: uri }

    PersonalBest:
      type: object
      required: [trackId, trackName, country, trackType, bestLapMs, setAt, lapCount]
      properties:
        trackId: { type: string, format: uuid }
        trackName: { type: string }
        country: { type: string }
        trackType: { $ref: '#/components/schemas/TrackType' }
        bestLapMs: { type: integer, description: Fastest valid lap from any session, ranked or private. }
        setAt: { type: string, format: date-time }
        vehicle: { oneOf: [{ $ref: '#/components/schemas/ProfileVehicle' }, { type: 'null' }] }
        lapCount: { type: integer }
        rank: { type: [integer, 'null'], description: Public leaderboard position; null without a ranked standing. }
        fieldSize: { type: [integer, 'null'] }
        rankedLapMs: { type: [integer, 'null'], description: The time the rank is for. }

    ProfileStats:
      type: object
      required: [sessionCount, lapCount, trackCount, vehicleCount, personalBests]
      properties:
        sessionCount: { type: integer, description: Non-voided sessions. }
        lapCount: { type: integer, description: Valid laps (no signal gap) in non-voided sessions. }
        trackCount: { type: integer }
        vehicleCount: { type: integer }
        distanceKm: { type: [number, 'null'], description: Valid laps times track length. }
        firstSessionAt: { type: [string, 'null'], format: date-time }
        lastSessionAt: { type: [string, 'null'], format: date-time }
        mainVehicle: { oneOf: [{ $ref: '#/components/schemas/ProfileVehicle' }, { type: 'null' }] }
        personalBests:
          type: array
          description: Ranked tracks first by position, then the rest by name.
          items: { $ref: '#/components/schemas/PersonalBest' }

    UploadRequest:
      type: object
      required: [kind, contentType]
      properties:
        kind: { type: string, enum: [Avatar, VehiclePhoto] }
        vehicleId: { type: string, format: uuid, description: Required for VehiclePhoto. }
        contentType: { type: string, enum: [image/jpeg, image/webp] }

    UploadTarget:
      type: object
      required: [uploadUrl, path, publicUrl]
      properties:
        uploadUrl: { type: string, format: uri, description: PUT the bytes here. }
        path: { type: string, description: 'Attach with PUT /me/avatar or /vehicles/{vehicleId}/photo.' }
        publicUrl: { type: string, format: uri }

    SetMedia:
      type: object
      required: [path]
      properties:
        path: { type: string, maxLength: 300 }

    AccountExport:
      type: object
      description: Profile, vehicles, owned tracks with points, and sessions with laps and sectors.
      required: [exportedAt, profile, vehicles, tracks, sessions]
      properties:
        exportedAt: { type: string, format: date-time }
        profile: { $ref: '#/components/schemas/Profile' }
        vehicles: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }
        tracks: { type: array, items: { type: object } }
        sessions: { type: array, items: { type: object } }

    # ── Vehicles ── (fields are VehicleInformationData, unchanged)
    VehicleWrite:
      type: object
      required: [manufacturer, model, year, engineType, horsepower, weight, drivetrain, fuelType, tireType, transmission]
      properties:
        manufacturer: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        year: { type: integer, minimum: 1885, maximum: 2100 }
        engineType: { type: string, maxLength: 50 }
        horsepower: { type: integer, minimum: 0, maximum: 5000 }
        torque: { type: [integer, 'null'], minimum: 0, maximum: 5000, description: Nm }
        weight: { type: number, minimum: 0.1, maximum: 10000, description: kg }
        topSpeed: { type: [number, 'null'], minimum: 0, maximum: 1000, description: km/h }
        acceleration: { type: [number, 'null'], minimum: 0, maximum: 60, description: '0-100 km/h, seconds' }
        drivetrain: { type: string, maxLength: 20 }
        fuelType: { type: string, maxLength: 20 }
        tireType: { type: string, maxLength: 50 }
        fuelCapacity: { type: [number, 'null'], minimum: 0, maximum: 1000, description: litres }
        transmission: { type: string, maxLength: 50 }
        suspensionType: { type: [string, 'null'], maxLength: 100 }

    Vehicle:
      allOf:
        - $ref: '#/components/schemas/VehicleWrite'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            photoUrl: { type: [string, 'null'], format: uri, description: Public URL of the vehicle photo. }

    VehiclePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Vehicle' }

    VehicleSummary:
      type: object
      required: [manufacturer, model, year]
      properties:
        manufacturer: { type: string }
        model: { type: string }
        year: { type: integer }

    # ── Tracks ──
    TrackType:
      type: string
      enum: [Circuit, Sprint]

    TrackVisibility:
      type: string
      enum: [Private, Published]
      default: Private

    TrackPoint:
      type: object
      description: >-
        One TrackCoordinatesData row. Timing gates are derived on the device from the
        ordered list, so order and flags must round-trip exactly.
      required: [seq, latitude, longitude]
      properties:
        seq: { type: integer, minimum: 0, description: Position in the ordered list. }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        altitude: { type: [number, 'null'], description: metres }
        isStartPoint: { type: boolean, default: false }
        isSectorPoint: { type: boolean, default: false }
        sectorIndex: { type: [integer, 'null'], minimum: 0 }

    TrackWrite:
      type: object
      required: [name, country, type, points]
      properties:
        name: { type: string, maxLength: 120 }
        country: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/TrackType' }
        lengthMeters: { type: [number, 'null'], minimum: 0 }
        visibility: { $ref: '#/components/schemas/TrackVisibility' }
        points:
          type: array
          minItems: 2
          maxItems: 20000
          items: { $ref: '#/components/schemas/TrackPoint' }

    TrackSummary:
      type: object
      required: [id, name, country, type, visibility, ownerDisplayName, sectorCount, rankedLapCount, geometryLocked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        type: { $ref: '#/components/schemas/TrackType' }
        visibility: { $ref: '#/components/schemas/TrackVisibility' }
        lengthMeters: { type: [number, 'null'] }
        ownerDisplayName: { type: string }
        startLatitude: { type: [number, 'null'] }
        startLongitude: { type: [number, 'null'] }
        distanceKm:
          type: [number, 'null']
          description: Distance from `near`, when it was supplied.
        sectorCount:
          type: integer
          description: Number of points flagged isSectorPoint (sector gates).
        rankedLapCount: { type: integer }
        geometryLocked:
          type: boolean
          description: True once a ranked lap exists; point order, positions and the start flag can no longer change.

    Track:
      allOf:
        - $ref: '#/components/schemas/TrackSummary'
        - type: object
          required: [points, createdAt, updatedAt]
          properties:
            points:
              type: array
              items: { $ref: '#/components/schemas/TrackPoint' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    TrackSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TrackSummary' }

    # ── Sessions ──
    SessionVisibility:
      type: string
      enum: [Private, Ranked]
      default: Private
      description: '`Ranked` submits the session''s laps to the track leaderboard.'

    Weather:
      type: object
      description: The weather fields of SessionData, grouped.
      properties:
        tempC: { type: [number, 'null'] }
        humidityPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        precipitationMm: { type: [number, 'null'], minimum: 0 }
        weatherCode: { type: [integer, 'null'], description: WMO weather code. }
        windKph: { type: [number, 'null'], minimum: 0 }
        windDirDeg: { type: [integer, 'null'], minimum: 0, maximum: 360 }
        pressureHpa: { type: [number, 'null'] }

    SectorSplit:
      type: object
      required: [sectorIndex, splitMs]
      properties:
        sectorIndex: { type: integer, minimum: 0 }
        splitMs:
          type: integer
          minimum: 1
          description: Time for this sector alone, not cumulative (matches SectorTimeData).

    LapWrite:
      type: object
      description: >-
        A completed lap, or a completed run on a Sprint track. Laps still IN PROGRESS or
        INVALID on the device are not uploaded.
      required: [lapNumber, timeMs]
      properties:
        lapNumber: { type: integer, minimum: 1 }
        timeMs: { type: integer, minimum: 1, maximum: 3600000 }
        signalGap:
          type: boolean
          default: false
          description: GPS dropped out during the lap. Such laps never rank.
        sectors:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SectorSplit' }

    Lap:
      allOf:
        - $ref: '#/components/schemas/LapWrite'
        - type: object
          required: [countsForLeaderboard]
          properties:
            countsForLeaderboard:
              type: boolean
              description: >-
                True when the session is Ranked and not voided, the lap has no signal gap,
                and the track is Published. Lap times are not verified.
            leaderboardRank:
              type: [integer, 'null']
              description: Current rank if this is the driver's best ranked lap on the track.

    SessionWrite:
      type: object
      required: [name, startedAt, gpsSource, laps]
      properties:
        name:
          type: string
          maxLength: 200
          description: The app's eventType, e.g. "Hungaroring - 2026-09-28".
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        vehicleId: { type: [string, 'null'], format: uuid }
        trackId:
          type: [string, 'null']
          format: uuid
          description: Must reference a track uploaded earlier, the caller's or a published one.
        gpsSource: { $ref: '#/components/schemas/GpsSource' }
        visibility: { $ref: '#/components/schemas/SessionVisibility' }
        voided: { type: boolean, default: false }
        weather: { $ref: '#/components/schemas/Weather' }
        appVersion:
          type: string
          maxLength: 40
          description: >-
            App version that timed the session. Recorded so a change to on-device gate
            derivation can be traced later.
        laps:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LapWrite' }

    SessionSummary:
      type: object
      required: [id, name, startedAt, gpsSource, visibility, voided, lapCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        trackId: { type: [string, 'null'], format: uuid }
        trackName: { type: [string, 'null'] }
        vehicleId: { type: [string, 'null'], format: uuid }
        gpsSource: { $ref: '#/components/schemas/GpsSource' }
        visibility: { $ref: '#/components/schemas/SessionVisibility' }
        voided: { type: boolean }
        lapCount: { type: integer }
        bestLapMs: { type: [integer, 'null'] }

    Session:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [laps, createdAt, updatedAt]
          properties:
            weather: { $ref: '#/components/schemas/Weather' }
            appVersion: { type: [string, 'null'] }
            laps:
              type: array
              items: { $ref: '#/components/schemas/Lap' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SessionSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SessionSummary' }

    # ── Leaderboards ──
    LeaderboardEntry:
      type: object
      required: [rank, userId, displayName, lapTimeMs, setAt, gpsSource]
      properties:
        rank: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        lapTimeMs: { type: integer }
        gapToLeaderMs: { type: integer, minimum: 0 }
        sectors:
          type: array
          items: { $ref: '#/components/schemas/SectorSplit' }
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/VehicleSummary'
            - type: 'null'
        setAt: { type: string, format: date-time }
        gpsSource: { $ref: '#/components/schemas/GpsSource' }

    Leaderboard:
      type: object
      required: [trackId, trackName, entries]
      properties:
        trackId: { type: string, format: uuid }
        trackName: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardEntry' }
        me:
          description: >-
            The caller's own entry, even when it falls outside `limit`. Null if they have no
            ranked lap here, or if the request was made without signing in.
          oneOf:
            - $ref: '#/components/schemas/LeaderboardEntry'
            - type: 'null'
